<script>
    let pipeline;
    function initWebGPU(device, format) {
        const wgsl = `
            @vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4<f32> {
                var pos = array<vec2<f32>,3>(vec2(-1.,-1.), vec2(3.,-1.), vec2(-1.,3.));
                return vec4<f32>(pos[i], 0.0, 1.0);
            }
            @fragment fn fs() -> @location(0) vec4<f32> { return vec4<f32>(0.05, 0.04, 0.09, 1.0); }
        `;
        pipeline = device.createRenderPipeline({
            layout: 'auto',
            vertex: { module: device.createShaderModule({code: wgsl}), entryPoint: 'vs' },
            fragment: { module: device.createShaderModule({code: wgsl}), entryPoint: 'fs', targets: [{format}] }
        });
    }
    function renderWebGPU(renderPass) {
        renderPass.setPipeline(pipeline);
        renderPass.draw(3);
    }
    function render2d(ctx) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
        for(let i=0; i<600; i+=20) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 600); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(600, i); ctx.stroke();
        }
    }
</script>
