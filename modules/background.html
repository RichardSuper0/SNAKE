<style>
        :root {
            --bg1: #162b49;
            --bg2: #0a1325;
            --panel: #17345a;
            --green: #4e9b5f;
            --green2: #286b42;
            --red: #ff5364;
            --yellow: #ffd34d;
            --text: #fffdf3;
            --muted: #c5d5ea;
            --shadow: rgba(2, 8, 20, 0.42);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, rgba(74, 222, 128, 0.12), transparent 18%),
                linear-gradient(135deg, var(--bg1), var(--bg2));
            color: var(--text);
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 14px;
        }

        #gameWrap {
            position: relative;
            width: min(92vw, calc(92vh - 92px), 560px);
            height: min(92vw, calc(92vh - 92px), 560px);
            aspect-ratio: 1;
            border-radius: 30px;
            background: #0a172c;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45), inset 0 0 30px rgba(255, 255, 255, 0.04);
            overflow: hidden;
            border: 4px solid #24466d;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #050d13;
            image-rendering: auto;
            image-rendering: -webkit-optimize-contrast;
        }

        .hud,
        .controls {
            position: relative;
            width: min(92vw, 92vh, 560px);
        }

        .hud {
            display: flex;
            align-items: center;
            justify-content: space-between;
            pointer-events: none;
            padding: 0 4px;
        }

        .brand {
            font-weight: 900;
            letter-spacing: 0.18em;
            font-size: clamp(0.8rem, 1.8vw, 1.2rem);
            color: #fff3bd;
            text-shadow: 0 3px 0 #6c4a2d;
        }

        .scoreBox {
            background: #1b3e63;
            border: 3px solid #376b98;
            border-radius: 16px;
            padding: 8px 13px;
            box-shadow: 0 4px 0 #071326, 0 10px 20px rgba(0, 0, 0, 0.22);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .scoreLabel {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
        }

        #score {
            font-weight: 900;
            font-size: clamp(1.2rem, 2.3vw, 2rem);
            color: #ffe06a;
            min-width: 54px;
            text-align: right;
        }

        .controls {
            margin-top: 2px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            pointer-events: auto;
        }

        button {
            border: none;
            border-radius: 14px;
            padding: 11px 16px;
            background: linear-gradient(#ffe17a, #eeb83d);
            color: #39220b;
            font-weight: 900;
            letter-spacing: 0.01em;
            cursor: pointer;
            box-shadow: 0 5px 0 #916128, 0 9px 18px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.72);
            transition: transform 0.12s ease, filter 0.12s ease, background 0.12s ease;
        }

        button:hover {
            transform: translateY(-1px);
            filter: brightness(1.04);
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #916128, 0 5px 12px rgba(0, 0, 0, 0.2);
        }

        #startBtn {
            background: linear-gradient(#78bd72, #3f8b55);
            color: #f2ffe9;
            min-width: 120px;
        }

        #pauseBtn:hover,
        #restartBtn:hover {
            background: linear-gradient(#ffea9c, #f5c94f);
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            background: rgba(0, 0, 0, 0.36);
            backdrop-filter: blur(4px);
            z-index: 20;
            transition: opacity 0.18s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .panel {
            background: #17345a;
            border: 3px solid #2d5684;
            border-radius: 26px;
            padding: 28px 30px 24px;
            text-align: center;
            box-shadow: 0 7px 0 #071326, 0 24px 60px rgba(0, 0, 0, 0.35);
        }

        .panel h1 {
            margin: 0 0 8px;
            font-size: clamp(2rem, 4vw, 3.3rem);
            letter-spacing: 0.14em;
        }

        .panel p {
            margin: 0 0 18px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .module-error {
            color: #ffb4b4;
            font-weight: 700;
        }

        @media (max-width: 420px) {
            body {
                padding-inline: 10px;
            }

            .controls {
                gap: 6px;
            }

            button {
                padding-inline: 12px;
                font-size: 0.82rem;
            }
        }
    </style>
<div class="hud" data-object="background">
    <div class="brand">SNAKE</div>
    <div class="scoreBox">
        <span class="scoreLabel">Score</span>
        <span id="score">0</span>
    </div>
</div>

<div id="gameWrap" class="game-wrap">
    <div id="boardSlot"></div>
    <div id="snakeSlot" aria-hidden="true"></div>
    <div id="appleSlot" aria-hidden="true"></div>

    <div id="overlay" class="overlay">
        <div class="panel">
            <h1>SNAKE</h1>
            <p>WASD o Frecce per muoverti</p>
            <button id="startBtn">Gioca</button>
        </div>
    </div>
</div>
