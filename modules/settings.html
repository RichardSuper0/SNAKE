<style>
    .settings-panel {
        position: absolute;
        inset: 7% 7%;
        z-index: 30;
        display: none;
        overflow: auto;
        padding: 24px;
        border: 3px solid #2d5684;
        border-radius: 24px;
        background: var(--panel-color, #17345a);
        box-shadow: 0 8px 0 #071326, 0 24px 60px rgba(0, 0, 0, 0.38);
    }

    .settings-panel.open {
        display: block;
    }

    .settings-panel h2 {
        margin: 0 0 16px;
        color: var(--screen-text, #fff);
    }

    .settings-panel .setting {
        margin: 10px 0;
    }

    .settings-panel .energy {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 16px 0;
        color: var(--muted, #c5d5ea);
        font-weight: 800;
    }

    .settings-close {
        margin-top: 10px;
        background: #4d8fd1;
        color: #fff;
    }
</style>
<section id="settingsPanel" class="settings-panel" aria-label="Impostazioni">
    <h2>Impostazioni</h2>
    <label class="setting">Bottoni
        <select id="buttonThemeSelect">
            <option value="white" selected>Bianco</option>
            <option value="yellow">Giallo</option>
            <option value="whiteRainbow">Bianco Rainbow</option>
            <option value="yellowRainbow">Giallo Rainbow</option>
            <option value="random">Random</option>
        </select>
    </label>
    <label class="setting">Serpente
        <select id="snakeThemeSelect">
            <option value="white" selected>Bianco</option>
            <option value="yellow">Giallo</option>
            <option value="whiteRainbow">Bianco Rainbow</option>
            <option value="yellowRainbow">Giallo Rainbow</option>
            <option value="random">Random</option>
        </select>
    </label>
    <label class="setting">Tavola / schermate
        <select id="boardThemeSelect">
            <option value="blue" selected>Blu</option>
            <option value="blueRainbow">Blu Rainbow</option>
            <option value="white">Bianco</option>
            <option value="yellow">Giallo</option>
            <option value="whiteRainbow">Bianco Rainbow</option>
            <option value="yellowRainbow">Giallo Rainbow</option>
            <option value="random">Random</option>
        </select>
    </label>
    <label class="energy">
        <input id="energySavingSelect" type="checkbox" />
        Risparmio energetico
    </label>
    <button id="settingsCloseBtn" class="settings-close">Chiudi</button>
</section>
