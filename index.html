<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASM Bootloader</title>
    <style>
        body {
            margin: 0; background: #090811; color: #fff;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100vh; font-family: system-ui, sans-serif; overflow: hidden;
        }
        #hud { font-size: 20px; margin-bottom: 10px; letter-spacing: 1px; }
        span { font-weight: bold; color: #00f2fe; }
    </style>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="hud">SCORE: <span id="score">000</span> | MODE: <span id="mode-val">...</span></div>
    <div id="game-root"></div>

    <script type="module">
        const mode = !!navigator.gpu ? 'webgpu' : 'canvas2d';
        document.getElementById('mode-val').innerText = mode.toUpperCase();

        window.graphics = { mode: mode };

        const r = await fetch('./modules/engine.html');
        const engineHTML = await r.text();
        
        document.getElementById('game-root').innerHTML = engineHTML;

        const scriptText = new DOMParser().parseFromString(engineHTML, 'text/html').querySelector('script').textContent;
        const runEngine = new Function(scriptText);
        runEngine();
    </script>
</body>
</html>
